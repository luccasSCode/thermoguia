name: thermoguia
description: ThermoGuia Manaus — assistente inteligente e adaptativo de conforto térmico urbano.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  thermo_core:
    path: ../packages/thermo_core

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  image_picker: ^1.2.4
  flutter_svg: ^2.0.9
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/

# Ícones do app (lojas e tela inicial do aparelho). Os PNGs saem do desenho
# vetorial: flutter test tool/render_brand_assets.dart && dart run flutter_launcher_icons
# iOS 18: variantes Escuro e Tingido automáticas. Android 13+: ícone temático
# (monocromático); Escuro e Tingido também podem ser escolhidos no Perfil.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  image_path_ios_dark_transparent: "assets/branding/app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/branding/app_icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
  min_sdk_android: 21

# Tela de abertura nativa: dart run flutter_native_splash:create
# Fica vazia, só com a cor de fundo: a animação da folha (AnimatedSplash)
# começa no primeiro quadro do app. No Android 12+, a imagem transparente
# evita que o sistema mostre o ícone antes da animação.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1A24"
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_blank.png
    color_dark: "#0F1A24"
    image_dark: assets/branding/splash_blank.png
  fullscreen: false
